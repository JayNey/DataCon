name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_USER: datacon
          # The database is reachable only from this isolated runner. Localhost
          # trust keeps every credential out of the repository; never reuse this
          # setting for a shared or production database.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: datacon
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U datacon -d datacon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATACON_DATABASE_URL: "postgresql://datacon@127.0.0.1:5432/datacon"
      DATACON_TEST_DATABASE_URL: "postgresql://datacon@127.0.0.1:5432/datacon"
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            --only-binary :all: -r requirements-ci.txt
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Verify the build backend is bundled with uv
        shell: bash
        run: |
          output="$(uv sync --frozen --reinstall-package datacon -v 2>&1)"
          printf '%s\n' "$output"
          grep -Fq "Performing direct build for datacon" <<<"$output"
          if grep -Fiq "setuptools" <<<"$output"; then
            echo "setuptools must not be resolved as the build backend" >&2
            exit 1
          fi
      - name: Apply database migrations
        run: |
          uv run --frozen python - <<'PY'
          import os
          import pathlib
          import psycopg

          with psycopg.connect(os.environ["DATACON_DATABASE_URL"], autocommit=True) as conn:
              for migration in sorted(pathlib.Path("migrations").glob("*.sql")):
                  conn.execute(migration.read_text(encoding="utf-8"))
          PY
      - name: Install host clang, LLVM symbolizer and patch
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm patch
      - name: Verify host ASan smoke toolchain
        run: |
          # Local/CI smoke uses the runner's host clang. The pinned clang 19.1.7
          # replay image is verified by the T05 task, not here.
          clang --version
          llvm-symbolizer --version
      - name: Build wheel and verify the packaged case registry
        shell: bash
        run: |
          uv build --wheel
          wheel="$(ls -t dist/*.whl | head -n 1)"
          target="$RUNNER_TEMP/datacon-wheel"
          rm -rf "$target"
          mkdir -p "$target"
          python -m zipfile -e "$wheel" "$target"
          cd "$RUNNER_TEMP"
          env -u DATACON_CASE_ROOT PYTHONPATH="$target" python -S - <<'PY'
          import json
          import os

          import datacon

          assert os.path.dirname(os.path.realpath(datacon.__file__)) == os.path.join(
              os.environ["PYTHONPATH"], "datacon"
          )
          from datacon.contracts import parse_request

          request = {
              "schema_version": 1,
              "cve_id": "CVE-2099-0001",
              "target": {
                  "kind": "source",
                  "case_id": "fixture-c-parser",
                  "goal": "wheel smoke",
              },
          }
          assert parse_request(json.dumps(request))["target"]["case_id"] == (
              "fixture-c-parser"
          )
          print("wheel case registry ok")
          PY
      - name: Run contract, PostgreSQL, workflow and ASan fixture tests
        run: uv run --frozen pytest -q
