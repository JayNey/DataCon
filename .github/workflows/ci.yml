name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: datacon
          POSTGRES_PASSWORD: datacon
          POSTGRES_DB: datacon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datacon -d datacon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATACON_DATABASE_URL: postgresql://datacon:datacon@127.0.0.1:5432/datacon
      DATACON_TEST_DATABASE_URL: postgresql://datacon:datacon@127.0.0.1:5432/datacon
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.7
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Apply database migration
        run: |
          uv run --frozen python - <<'PY'
          import os
          import psycopg

          sql = open("migrations/001_create_jobs.sql", encoding="utf-8").read()
          with psycopg.connect(os.environ["DATACON_DATABASE_URL"], autocommit=True) as conn:
              conn.execute(sql)
          PY
      - name: Install clang and LLVM symbolizer
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
      - name: Verify clang for ASan fixture replay
        run: clang --version
      - name: Run contract, PostgreSQL and ASan fixture tests
        run: uv run --frozen pytest -q
