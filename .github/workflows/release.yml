          if acceptance["replay_count"] != 6:
              raise SystemExit(
                  f"B03 acceptance replay_count mismatch: {acceptance['replay_count']!r}"
              )
          if acceptance["bundle_verified"] is not True:
              raise SystemExit("B03 acceptance bundle_verified must be True")
          PY
      - name: Upload only the sanitized B03 summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b03-acceptance-summary
          path: b03-acceptance-summary.json
          retention-days: 30
