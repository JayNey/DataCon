name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
        env:
          POSTGRES_USER: datacon
          # The database is reachable only from this isolated runner. Localhost
          # trust keeps every credential out of the repository; never reuse this
          # setting for a shared or production database.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: datacon
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U datacon -d datacon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATACON_DATABASE_URL: "postgresql://datacon@127.0.0.1:5432/datacon"
      DATACON_TEST_DATABASE_URL: "postgresql://datacon@127.0.0.1:5432/datacon"
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            --only-binary :all: -r requirements-ci.txt
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Verify the build backend is bundled with uv
        shell: bash
        run: |
          output="$(uv sync --frozen --reinstall-package datacon -v 2>&1)"
          printf '%s\n' "$output"
          grep -Fq "Performing direct build for datacon" <<<"$output"
          if grep -Fiq "setuptools" <<<"$output"; then
            echo "setuptools must not be resolved as the build backend" >&2
            exit 1
          fi
      - name: Apply database migrations
        run: |
          uv run --frozen python - <<'PY'
          import os
          import pathlib
          import psycopg

          with psycopg.connect(os.environ["DATACON_DATABASE_URL"], autocommit=True) as conn:
              for migration in sorted(pathlib.Path("migrations").glob("*.sql")):
                  conn.execute(migration.read_text(encoding="utf-8"))
          PY
      - name: Install host clang, LLVM symbolizer and patch
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm patch
      - name: Verify required CI database and toolchain
        shell: bash
        run: |
          set -euo pipefail
          # A missing database or symbolizer must fail here, before pytest can
          # turn the core PostgreSQL/ASan suites into skips.
          if [[ -z "${DATACON_TEST_DATABASE_URL:-}" ]]; then
            echo "DATACON_TEST_DATABASE_URL must be set in CI" >&2
            exit 1
          fi
          for tool in clang llvm-symbolizer patch docker; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "required CI tool is missing: $tool" >&2
              exit 1
            fi
          done
          clang --version
          llvm-symbolizer --version
          patch --version
          docker version
          # The T05/T06 gate runs against the same immutable image recorded in
          # the synthetic case manifest. Pull by digest before pytest so a
          # registry outage is reported as a CI failure, not a test skip.
          docker pull silkeh/clang:19-bookworm@sha256:f5ce959d91f059acf5a4b3f1c19f46713c4b2881c7d7cd1d5143ca1d1412277f
          docker image inspect \
            silkeh/clang:19-bookworm@sha256:f5ce959d91f059acf5a4b3f1c19f46713c4b2881c7d7cd1d5143ca1d1412277f \
            --format '{{.Id}}' >/dev/null
      - name: Build wheel and verify packaged case data
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel
          wheel="$(ls -t dist/*.whl | head -n 1)"
          python - "$wheel" <<'PY'
          import sys
          import zipfile

          names = set(zipfile.ZipFile(sys.argv[1]).namelist())
          required = [
              "datacon/data/cases/registry.json",
              "datacon/data/cases/manifest.json",
              "datacon/data/cases/advisory.json",
              "datacon/data/cases/vulnerable/parser.c",
              "datacon/data/cases/fixed/parser.c",
              "datacon/data/cases/harness.c",
              "datacon/data/cases/fixture-repo.bundle",
              "datacon/data/cases/fix.patch",
              "datacon/data/cases/build.sh",
              "datacon/data/cases/dependencies.lock",
              "datacon/data/cases/inputs/candidate.txt",
              "datacon/data/cases/inputs/clean.txt",
              "datacon/data/cases/inputs/normal.txt",
              "datacon/data/seccomp/default.json",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f"wheel is missing case data: {missing}")
          print("wheel case data ok")
          PY
      - name: Install wheel in a clean venv and exercise the entry point
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls -t dist/*.whl | head -n 1)"
          venv="$RUNNER_TEMP/datacon-venv"
          rm -rf "$venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install \
            --no-index --no-deps --disable-pip-version-check "$wheel"
          # Dependencies come from the locked project environment. The datacon
          # package itself must come from the installed wheel, not from a
          # PYTHONPATH pointing at an unpacked zip.
          deps_site="$(uv run --frozen python -c \
            'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          export PYTHONPATH="$deps_site"
          unset DATACON_CASE_ROOT
          "$venv/bin/datacon" --help
          "$venv/bin/python" - <<'PY'
          import importlib.metadata as metadata
          import json
          import os
          import sysconfig

          import datacon

          site = os.path.realpath(sysconfig.get_paths()["purelib"])
          package_file = os.path.realpath(datacon.__file__)
          assert package_file.startswith(site + os.sep), package_file

          assert metadata.version("datacon") == "0.1.0"
          requires = metadata.requires("datacon") or []
          assert any(item.lower().startswith("psycopg") for item in requires), requires
          entry_points = {
              entry.name: entry.value
              for entry in metadata.entry_points(group="console_scripts")
          }
          assert entry_points.get("datacon") == "datacon.cli:main", entry_points

          from datacon.agents.analysis import analyze_case
          from datacon.contracts import DEFAULT_LIMITS, parse_request

          request = parse_request(
              json.dumps(
                  {
                      "schema_version": 1,
                      "cve_id": "CVE-2099-0001",
                      "target": {
                          "kind": "source",
                          "case_id": "fixture-c-parser",
                          "goal": "installed wheel smoke",
                      },
                      "limits": dict(DEFAULT_LIMITS),
                  }
              )
          )
          assert request["target"]["case_id"] == "fixture-c-parser"
          analyzed = analyze_case(request)
          assert analyzed.plan["case_id"] == "fixture-c-parser"
          assert analyzed.plan_digest.startswith("sha256:")
          print("installed wheel smoke ok")
          PY
      - name: Run test suites with zero skips
        shell: bash
        run: |
          set -euo pipefail

          run_suite() {
            local marker="$1"
            local label="$2"
            local report="$RUNNER_TEMP/${label}.xml"
            uv run --frozen pytest -q -m "$marker" -rs --junitxml="$report"
            uv run --frozen python - "$report" "$label" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path, label = sys.argv[1], sys.argv[2]
          root = ET.parse(path).getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          total = sum(int(suite.get("tests", 0)) for suite in suites)
          skipped = sum(int(suite.get("skipped", 0)) for suite in suites)
          failures = sum(int(suite.get("failures", 0)) for suite in suites)
          errors = sum(int(suite.get("errors", 0)) for suite in suites)
          print(
              f"{label}: total={total} skipped={skipped} "
              f"failures={failures} errors={errors}"
          )
          if total == 0:
              raise SystemExit(f"the {label} suite did not run any tests")
          if skipped or failures or errors:
              raise SystemExit(
                  f"CI requires the {label} suite to pass with zero skips"
              )
          PY
          }

          # T03/T04 PostgreSQL, workflow and migration paths must actually run.
          run_suite "postgres and not docker" postgres
          # T05/T06 real Linux isolation, build, six-replay and evidence gates.
          run_suite "postgres and docker" docker
          # ASan frame/source assertions must actually run.
          run_suite asan asan
          # Contract, analysis, verdict, evidence, wheel and entry-point checks.
          run_suite "not postgres and not asan" contract
