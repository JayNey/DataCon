[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datacon"
version = "0.1.0"
description = "DataCon CVE reproduction control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
datacon = "datacon.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires a migrated PostgreSQL test database",
    "asan: requires a C compiler with AddressSanitizer support",
]
