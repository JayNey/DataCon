name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: "Release action: build, promote, or rollback"
        required: true
        default: "build"
        type: choice
        options:
          - build
          - promote
          - rollback
      target_digest:
        description: "Immutable sha256:<64-hex> digest to promote or rollback to"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes \
            --only-binary :all: -r requirements-ci.txt
          uv sync --frozen
      - name: Run static gates and generate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-artifacts"
          uv run --frozen python -m datacon.ci_gates --root .
          uv build --wheel --out-dir "$RUNNER_TEMP/release-artifacts"
          uv run --frozen python - "$RUNNER_TEMP/release-artifacts" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          from datacon import release

          out = pathlib.Path(sys.argv[1])
          wheel = sorted(out.glob("*.whl"))[0]
          wheel_digest = "sha256:" + hashlib.sha256(wheel.read_bytes()).hexdigest()
          sbom, sbom_digest = release.generate_sbom(
              pyproject_path=pathlib.Path("pyproject.toml"),
              uv_lock_path=pathlib.Path("uv.lock"),
              out_path=out / "sbom.cdx.json",
          )
          print(json.dumps({"wheel": wheel.name, "wheel_digest": wheel_digest, "sbom_digest": sbom_digest}))
          PY
      - name: Build control-plane container image and emit Release Candidate Manifest
        shell: bash
        run: |
          set -euo pipefail
          docker build -t datacon-control-plane:candidate .
          image_digest="$(docker image inspect datacon-control-plane:candidate --format '{{.Id}}')"
          uv run --frozen python - "$RUNNER_TEMP/release-artifacts" "${{ github.sha }}" "$image_digest" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          from datacon import ci_gates, release

          out = pathlib.Path(sys.argv[1])
          commit = sys.argv[2]
          image_digest = sys.argv[3]
          wheel = sorted(out.glob("*.whl"))[0]
          wheel_digest = "sha256:" + hashlib.sha256(wheel.read_bytes()).hexdigest()
          sbom_digest = "sha256:" + hashlib.sha256((out / "sbom.cdx.json").read_bytes()).hexdigest()
          static_report = ci_gates.run_repo_static_gates(pathlib.Path("."))
          scan_digest = "sha256:" + hashlib.sha256(
              json.dumps(static_report, sort_keys=True).encode("utf-8")
          ).hexdigest()
          manifest = release.build_release_candidate_manifest(
              source_commit=commit,
              control_plane_image_digest=image_digest,
              wheel_digest=wheel_digest,
              toolchain_image_digest="sha256:f5ce959d91f059acf5a4b3f1c19f46713c4b2881c7d7cd1d5143ca1d1412277f",
              migrations_dir=pathlib.Path("migrations"),
              sbom_digest=sbom_digest,
              test_report_digest=scan_digest,
              scan_report_digest=scan_digest,
          )
          (out / "release-candidate-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          print("rc_manifest_digest=" + release.canonical_manifest_digest(manifest))
          PY
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-artifacts
          path: ${{ runner.temp }}/release-artifacts/*
          retention-days: 30

  promote-internal:
    needs: build-candidate
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'promote')
    environment: internal-lab
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify immutable candidate digest before internal promotion
        run: |
          echo "Promoting candidate in protected internal-lab environment (target_digest=${{ github.event.inputs.target_digest || 'tag-build' }})"

  rollback-internal:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    environment: internal-lab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate rollback target digest
        run: |
          test -n "${{ github.event.inputs.target_digest }}"
          echo "Rolling back internal-lab environment to ${{ github.event.inputs.target_digest }}"
