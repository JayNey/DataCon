[build-system]
# uv_build ships inside uv. Pinning the same minor range (>=0.13.7,<0.14)
# ensures both CI (uv 0.13.7) and newer same-minor patches (e.g. 0.13.8 locally
# or in Dependabot) hit the bundled uv_build backend without falling back to
# PyPI, while still failing closed across minor versions (0.14.0).
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "datacon"
version = "0.1.0"
description = "DataCon CVE reproduction control plane"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "langgraph==1.2.22",
    "langgraph-checkpoint-postgres==3.2.1",
    "psycopg[binary]>=3.2,<4",
    "tree-sitter==0.26.1",
    "tree-sitter-c==0.24.2",
]

[project.scripts]
datacon = "datacon.cli:main"

[dependency-groups]
# Linters are pinned exactly so a local run and CI agree on rules and
# type-checker behaviour. Bump both through a reviewed dependency update.
dev = [
    "pytest>=8,<10",
    "pyyaml>=6,<7",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[tool.ruff]
target-version = "py311"
# Start from the long-standing Ruff defaults (E4/E7/E9/F). Widening the rule
# set is a separate, reviewable change rather than an implicit CI break.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
# Base profile, not strict: keep the gate useful without turning every dynamic
# boundary into a blanket failure. Missing third-party stubs are ignored.
ignore_missing_imports = true
warn_unused_configs = true
files = ["src/datacon"]

# Narrow per-module exceptions for legacy modules whose third-party typing or
# dynamic dict plumbing is not part of Step 4. Each override names the exact
# error codes; new error kinds in those modules still fail the gate.
[[tool.mypy.overrides]]
module = ["datacon.workflow"]
disable_error_code = ["assignment", "call-overload"]

[[tool.mypy.overrides]]
module = ["datacon.execution"]
disable_error_code = ["assignment", "misc", "var-annotated"]

[[tool.mypy.overrides]]
module = ["datacon.tools.sandbox"]
disable_error_code = ["assignment", "attr-defined", "union-attr"]

[[tool.mypy.overrides]]
module = ["datacon.evidence"]
disable_error_code = ["arg-type", "union-attr"]

[tool.uv]
# CI still pins exact uv==0.13.7 with its wheel sha256 in requirements-ci.txt;
# this same-minor range only allows same-minor uv runners (e.g. Dependabot and
# local environments on 0.13.x) without relaxing across minor versions.
required-version = ">=0.13.7,<0.14"

[tool.uv.build-backend]
module-name = "datacon"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires a migrated PostgreSQL test database",
    "asan: requires a C compiler with AddressSanitizer support",
    "docker: requires a Docker daemon and the pinned toolchain image",
]
